model:
  name: "DeepPavlov/rubert-base-cased"
  num_ner_labels: 7
  num_risk_labels: 3
  dropout: 0.1

data:
  dataset_name: "ruleganner"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_length: 512
  batch_size: 8
  num_workers: 4
  cache_dir: "./cache"

training:
  num_epochs: 3
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  mixed_precision: true
  fp16: false
  bf16: true
  alpha: 0.5
  beta: 0.5
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "f1"
  greater_is_better: true
  output_dir: "./outputs"
  save_total_limit: 2
  logging_steps: 50
  report_to: []

mlflow:
  experiment_name: "russian-legal-ner"
  tracking_uri: "./mlruns"
  run_name: null
  tags:
    project: "porada-legal-ai"
    model: "rubert"

defaults:
  - _self_

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
